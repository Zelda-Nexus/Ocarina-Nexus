# =============================================================================
# Job de modelisation Gold — dimensions, faits, fusion du graphe de
# connaissances (fact_entity_relation), stubs RAG.
# =============================================================================

resources:
  jobs:
    gold_transform:
      name: "ocarina — gold transform"
      description: "Modele en etoile (site) + fusion des relations entites (graphe)."

      tags:
        project: ocarina-nexus
        layer: gold

      tasks:
        - task_key: trigger_ops_quality
          run_job_task:
            job_id: ${resources.jobs.ops_quality.id}

        - task_key: gold_dimensions
          depends_on:
            - task_key: trigger_ops_quality
          notebook_task:
            notebook_path: ../../notebooks/gold/01_gold_dimensions.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_facts
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../../notebooks/gold/02_gold_facts.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_rag_stubs
          depends_on:
            - task_key: trigger_ops_quality
          notebook_task:
            notebook_path: ../../notebooks/gold/03_gold_rag_stubs.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_map_location
          depends_on:
            - task_key: gold_dimensions
          notebook_task:
            notebook_path: ../../notebooks/gold/04_gold_map_location.py
            base_parameters:
              catalog: ${var.catalog}

      queue:
        enabled: true

      max_concurrent_runs: 1

      # Le service principal de l'App lakehouse (app/) peut monitorer et
      # relancer ce job depuis /pipelines, jamais en editer la definition.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal_id}
