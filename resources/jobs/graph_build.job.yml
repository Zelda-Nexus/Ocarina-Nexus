# =============================================================================
# Job de construction du graphe de connaissances (GraphFrames).
#
# RISQUE (a valider avant premier deploiement reel, voir le plan) : la
# librairie Maven graphframes doit pouvoir s'attacher a un cluster classique.
# Verifier dans l'espace de travail reel que ce mecanisme est disponible sur
# la Free Edition avant de compter sur ce job.
# =============================================================================

resources:
  jobs:
    graph_build:
      name: "ocarina — graph build (GraphFrames)"
      description: "Materialisation noeuds/aretes + PageRank / composantes connexes."

      tags:
        project: ocarina-nexus
        layer: gold

      job_clusters:
        - job_cluster_key: graph_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2" # a ajuster au type de noeud reellement disponible
            num_workers: 1
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: trigger_gold
          run_job_task:
            job_id: ${resources.jobs.gold_transform.id}

        - task_key: graph_build_nodes_edges
          job_cluster_key: graph_cluster
          depends_on:
            - task_key: trigger_gold
          notebook_task:
            notebook_path: ../../notebooks/graph/01_graph_build_nodes_edges.scala
            base_parameters:
              catalog: ${var.catalog}

        - task_key: graph_algorithms
          job_cluster_key: graph_cluster
          depends_on:
            - task_key: graph_build_nodes_edges
          notebook_task:
            notebook_path: ../../notebooks/graph/02_graph_algorithms.scala
            base_parameters:
              catalog: ${var.catalog}
          libraries:
            - maven:
                coordinates: "graphframes:graphframes:0.8.4-spark3.5-s_2.12" # version a confirmer contre le runtime reel du cluster

      queue:
        enabled: true

      max_concurrent_runs: 1
