# =============================================================================
# Job de construction du graphe de connaissances (GraphFrames).
#
# RISQUE (a valider avant premier deploiement reel, voir le plan) : la
# librairie Maven graphframes doit pouvoir s'attacher a un cluster classique.
# Verifier dans l'espace de travail reel que ce mecanisme est disponible sur
# la Free Edition avant de compter sur ce job.
# =============================================================================

resources:
  jobs:
    graph_build:
      name: "ocarina — graph build (GraphFrames)"
      description: "Materialisation noeuds/aretes + PageRank / composantes connexes."

      tags:
        project: ocarina-nexus
        layer: gold

      tasks:
        - task_key: trigger_gold
          run_job_task:
            job_id: ${resources.jobs.gold_transform.id}

        - task_key: graph_build_nodes_edges
          depends_on:
            - task_key: trigger_gold
          notebook_task:
            notebook_path: ../../notebooks/graph/01_graph_build_nodes_edges.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: graph_algorithms
          depends_on:
            - task_key: graph_build_nodes_edges
          notebook_task:
            notebook_path: ../../notebooks/graph/02_graph_algorithms.py
            base_parameters:
              catalog: ${var.catalog}

      queue:
        enabled: true

      max_concurrent_runs: 1

      # Le service principal de l'App lakehouse (app/) peut monitorer et
      # relancer ce job depuis /pipelines, jamais en editer la definition.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal_id}
