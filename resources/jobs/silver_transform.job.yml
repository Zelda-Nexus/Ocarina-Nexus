# =============================================================================
# Job de transformation Silver — typage, deduplication, historisation SCD2.
# Premiere tache : declenche bronze_ingestion via run_job_task, pour pouvoir
# rejouer Silver seul (sans redeclencher Bronze) en desactivant juste cette
# tache depuis l'UI/CLI si besoin — Bronze reste la source de rejeu, pas une
# dependance obligatoire a chaque run.
# =============================================================================

resources:
  jobs:
    silver_transform:
      name: "ocarina — silver transform"
      description: >-
        Typage, deduplication, historisation SCD2 (entites Zelda Wiki) et
        eclatement des tables techniques/randomizer brutes.

      tags:
        project: ocarina-nexus
        layer: silver

      tasks:
        - task_key: trigger_bronze
          run_job_task:
            job_id: ${resources.jobs.bronze_ingestion.id}

        - task_key: silver_entity
          depends_on:
            - task_key: trigger_bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/01_silver_entity.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_i18n
          depends_on:
            - task_key: silver_entity
          notebook_task:
            notebook_path: ../../notebooks/silver/02_silver_i18n.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_engine
          depends_on:
            - task_key: trigger_bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/03_silver_engine.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_randomizer
          depends_on:
            - task_key: trigger_bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/04_silver_randomizer.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_speedrun
          depends_on:
            - task_key: trigger_bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/05_silver_speedrun.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_external
          depends_on:
            - task_key: trigger_bronze
          notebook_task:
            notebook_path: ../../notebooks/silver/06_silver_external.py
            base_parameters:
              catalog: ${var.catalog}

      queue:
        enabled: true

      max_concurrent_runs: 1

      # Le service principal de l'App lakehouse (app/) peut monitorer et
      # relancer ce job depuis /pipelines, jamais en editer la definition.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal_id}
