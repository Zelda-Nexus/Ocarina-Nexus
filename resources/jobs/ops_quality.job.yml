# =============================================================================
# Job de controle qualite — rejoue apres chaque run Silver.
# =============================================================================

resources:
  jobs:
    ops_quality:
      name: "ocarina — ops quality checks"
      description: "Controles NOT NULL / unicite / couverture / fraicheur sur Silver."

      tags:
        project: ocarina-nexus
        layer: ops

      tasks:
        - task_key: trigger_silver
          run_job_task:
            job_id: ${resources.jobs.silver_transform.id}

        - task_key: ops_quality_checks
          depends_on:
            - task_key: trigger_silver
          notebook_task:
            notebook_path: ../../notebooks/ops/01_ops_quality_checks.py
            base_parameters:
              catalog: ${var.catalog}

      queue:
        enabled: true

      max_concurrent_runs: 1

      # Le service principal de l'App lakehouse (app/) peut monitorer et
      # relancer ce job depuis /pipelines, jamais en editer la definition.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal_id}
