# =============================================================================
# Job d'ingestion Bronze — Auto Loader, notebooks Scala.
#
# Aucun bloc de compute n'est declare : le workspace Free Edition n'accepte
# que du compute serverless (confirme au premier deploiement, cf. historique
# git) — un job_cluster classique est rejete a la creation du job.
# =============================================================================

resources:
  jobs:
    bronze_ingestion:
      name: "ocarina — bronze ingestion"
      description: >-
        Auto Loader : copie fidele des fichiers JSONL du volume de landing
        vers les tables Delta Bronze. Append-only strict — voir
        notebooks/bronze/00_bronze_common.py.

      tags:
        project: ocarina-nexus
        layer: bronze

      tasks:
        - task_key: bronze_zeldawiki
          notebook_task:
            notebook_path: ../../notebooks/bronze/01_bronze_zeldawiki.py
            base_parameters:
              catalog: ${var.catalog}
              landing_volume: ${var.landing_volume}

        - task_key: bronze_technical
          notebook_task:
            notebook_path: ../../notebooks/bronze/02_bronze_technical.py
            base_parameters:
              catalog: ${var.catalog}
              landing_volume: ${var.landing_volume}

        - task_key: bronze_game_text
          notebook_task:
            notebook_path: ../../notebooks/bronze/03_bronze_game_text.py
            base_parameters:
              catalog: ${var.catalog}
              landing_volume: ${var.landing_volume}

        - task_key: bronze_speedrun
          notebook_task:
            notebook_path: ../../notebooks/bronze/04_bronze_speedrun.py
            base_parameters:
              catalog: ${var.catalog}
              landing_volume: ${var.landing_volume}

        - task_key: bronze_external
          notebook_task:
            notebook_path: ../../notebooks/bronze/05_bronze_external.py
            base_parameters:
              catalog: ${var.catalog}
              landing_volume: ${var.landing_volume}

      # Free Edition : max 5 taches de job simultanees pour tout le compte.
      queue:
        enabled: true

      max_concurrent_runs: 1

      # Le service principal de l'App lakehouse (app/) peut monitorer et
      # relancer ce job depuis /pipelines, jamais en editer la definition.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal_id}
